<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — StoryNest</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header class="nav" id="nav"></header>
<main class="wrap auth-shell" id="main">
  <div class="auth-card">
    <div class="center" style="margin-bottom:20px">
      <div style="font-size:2rem">📖</div>
      <h1 style="font-size:1.4rem;margin-bottom:2px">Welcome back</h1>
      <p class="muted small" style="margin:0">Sign in to keep reading.</p>
    </div>
    <div id="alert"></div>
    <form id="loginForm" class="form-grid" novalidate>
      <div class="field">
        <label for="identifier">Email or login ID</label>
        <input type="text" id="identifier" autocomplete="username" required
               placeholder="you@example.com or your login ID">
        <span class="hint">Grown-ups use their email. Children use the login ID their grown-up made for them.</span>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Sign in</button>
    </form>
    <p class="center small muted" style="margin:18px 0 0">
      New here? <a href="/register">Create a family account</a>
    </p>
  </div>
</main>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
