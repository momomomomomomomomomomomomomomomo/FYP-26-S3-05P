<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration — StoryNest</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header class="nav" id="nav"></header>
<main class="wrap" id="main">
  <div class="spread" style="margin:26px 0 14px">

      <h1 style="margin:0;font-size:1.5rem">Administration</h1>

  </div>

  <div id="alert"></div>

    <button class="tab" data-tab="logs">Audit log</button>

  <section id="panel-overview"></section>
  <section id="panel-users" class="hidden"></section>
  <section id="panel-content" class="hidden"></section>
  <section id="panel-categories" class="hidden"></section>
  <section id="panel-reports" class="hidden"></section>
  <section id="panel-announcements" class="hidden"></section>
  <section id="panel-logs" class="hidden"></section>
</main>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/admin.js"></script>

</html>
