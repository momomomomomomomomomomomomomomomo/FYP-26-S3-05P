<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="The Boy Who Counted Clouds">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#006d77"/><stop offset="1" stop-color="#83c5be"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1420" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#0a1420" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#0a1420" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  
    
    <g transform="translate(120 160) scale(1)" fill="#ffffff" opacity=".3">
      <circle cx="0" cy="0" r="34"/><circle cx="34" cy="8" r="26"/><circle cx="-32" cy="10" r="24"/>
      <rect x="-32" y="0" width="68" height="22" rx="11"/>
    </g>
    <g transform="translate(470 120) scale(0.75)" fill="#ffffff" opacity=".3">
      <circle cx="0" cy="0" r="34"/><circle cx="34" cy="8" r="26"/><circle cx="-32" cy="10" r="24"/>
      <rect x="-32" y="0" width="68" height="22" rx="11"/>
    </g>
    <g transform="translate(250 110) scale(0.5)" fill="#ffffff" opacity=".3">
      <circle cx="0" cy="0" r="34"/><circle cx="34" cy="8" r="26"/><circle cx="-32" cy="10" r="24"/>
      <rect x="-32" y="0" width="68" height="22" rx="11"/>
    </g>
    <g transform="translate(330 250) rotate(-12)">
      <path d="M0,-80 L58,0 L0,80 L-58,0 Z" fill="#ffddd2"/>
      <path d="M0,-80 L0,80 M-58,0 L58,0" stroke="#006d77" stroke-width="4" opacity=".55"/>
      <path d="M0,80 C18,110 -18,138 0,168 C18,196 -10,214 0,236" fill="none" stroke="#ffffff" stroke-width="4" opacity=".8"/>
    </g>
  <rect x="0" y="440" width="600" height="360" fill="url(#scrim)"/>
  <rect x="50" y="454" width="500" height="2" fill="#ffddd2" opacity=".9"/>
  <text x="300" y="535.6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="62" font-weight="700" fill="#ffffff" letter-spacing="1.5"><tspan x="300" dy="0">THE BOY WHO</tspan><tspan x="300" dy="68.2">COUNTED</tspan><tspan x="300" dy="68.2">CLOUDS</tspan></text>
  <text x="300" y="718" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="23" fill="#ffffff" opacity=".82">Maud Ellery</text>
  <text x="300" y="764" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="16" letter-spacing="3.5" fill="#ffddd2">STORYNEST</text>
