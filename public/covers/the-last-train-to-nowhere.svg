  <rect x="0" y="440" width="600" height="360" fill="url(#scrim)"/>
  <rect x="50" y="454" width="500" height="2" fill="#f2e9e4" opacity=".9"/>
  <text x="300" y="535.6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
