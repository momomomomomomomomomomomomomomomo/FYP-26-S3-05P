<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="The Last Train to Nowhere">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22223b"/><stop offset="1" stop-color="#4a4e69"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1420" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#0a1420" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#0a1420" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  
    
    <g transform="translate(120 160) scale(1)" fill="#ffffff" opacity=".3">
      <circle cx="0" cy="0" r="34"/><circle cx="34" cy="8" r="26"/><circle cx="-32" cy="10" r="24"/>
      <rect x="-32" y="0" width="68" height="22" rx="11"/>
    </g>
    <g transform="translate(470 120) scale(0.75)" fill="#ffffff" opacity=".3">
