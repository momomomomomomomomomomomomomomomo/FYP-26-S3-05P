      <rect x="-186" y="-82" width="44" height="34" rx="8"/>
      <circle cx="-130" cy="48" r="26" fill="#9a8c98"/><circle cx="-50" cy="48" r="26" fill="#9a8c98"/><circle cx="70" cy="48" r="26" fill="#9a8c98"/><circle cx="130" cy="48" r="26" fill="#9a8c98"/>
