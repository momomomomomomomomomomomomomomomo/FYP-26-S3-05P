<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Detective Duckling">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14746f"/><stop offset="1" stop-color="#8ecfc9"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1420" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#0a1420" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#0a1420" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  
    <g transform="translate(290 290) rotate(-20)">
      <circle cx="0" cy="0" r="92" fill="none" stroke="#ffb703" stroke-width="18"/>
      <circle cx="0" cy="0" r="78" fill="#06302e" opacity=".12"/>
      <rect x="-13" y="88" width="26" height="110" rx="12" fill="#ffb703"/>
    </g>
    <circle cx="160" cy="150" r="7" fill="#4cb3ad" opacity=".8"/><circle cx="420" cy="184" r="7" fill="#4cb3ad" opacity=".8"/><circle cx="200" cy="218" r="7" fill="#4cb3ad" opacity=".8"/><circle cx="440" cy="252" r="7" fill="#4cb3ad" opacity=".8"/>
  <rect x="0" y="440" width="600" height="360" fill="url(#scrim)"/>
  <rect x="50" y="522" width="500" height="2" fill="#ffb703" opacity=".9"/>
  <text x="300" y="603.8" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="62" font-weight="700" fill="#ffffff" letter-spacing="1.5"><tspan x="300" dy="0">DETECTIVE</tspan><tspan x="300" dy="68.2">DUCKLING</tspan></text>
  <text x="300" y="718" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
