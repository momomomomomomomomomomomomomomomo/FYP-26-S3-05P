<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="The Bridge That Took Nine Years">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2d42"/><stop offset="1" stop-color="#8d99ae"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1420" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#0a1420" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#0a1420" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  
    <g transform="translate(300 294) rotate(-4)">
      <path d="M-170,-110 L-56,-80 L58,-114 L170,-84 L170,110 L58,80 L-56,114 L-170,84 Z" fill="#ef233c"/>
      <path d="M-56,-80 L-56,114 M58,-114 L58,80" stroke="#2b2d42" stroke-width="4" opacity=".35"/>
      <path d="M-140,40 C-80,-10 -10,60 60,0 C110,-40 140,-10 150,10" fill="none"
